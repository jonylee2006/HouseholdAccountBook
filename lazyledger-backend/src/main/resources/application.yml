spring:
  application:
    name: lazyledger-backend
  datasource:
    url: jdbc:mysql://localhost:3306/lazyledger?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

server:
  port: 8080
  servlet:
    context-path: /api

lazyledger:
  storage:
    type: ${STORAGE_TYPE:OSS}
    bucket: ${STORAGE_BUCKET:lazyledger-dev}
    upload:
      directory: ${STORAGE_UPLOAD_DIR:statements}
      expire-seconds: ${STORAGE_UPLOAD_EXPIRE:600}
      max-size-mb: ${STORAGE_UPLOAD_MAX_MB:20}
      content-type: ${STORAGE_UPLOAD_CONTENT_TYPE:text/csv}
    oss:
      endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
      access-key-id: ${OSS_ACCESS_KEY:dummy}
      access-key-secret: ${OSS_ACCESS_SECRET:dummy}
    cos:
      region: ${COS_REGION:ap-guangzhou}
      secret-id: ${COS_SECRET_ID:dummy}
      secret-key: ${COS_SECRET_KEY:dummy}
      scheme: ${COS_SCHEME:https}
  import:
    queue:
      name: ${IMPORT_QUEUE_NAME:import.jobs.queue}
      exchange: ${IMPORT_EXCHANGE_NAME:import.jobs.exchange}
      routing-key: ${IMPORT_ROUTING_KEY:import.jobs.routing}
  remote:
    wechat:
      bill-url: ${WECHAT_BILL_URL:https://api.weixin.qq.com/pay/billdownload}
    alipay:
      bill-url: ${ALIPAY_BILL_URL:https://openapi.alipay.com/gateway.do}
  services:
    classification:
      url: ${CLASSIFICATION_SERVICE_URL:http://classification-service/api/v1/tasks}
      api-key: ${CLASSIFICATION_SERVICE_API_KEY:demo}
  events:
    budget:
      exchange: ${BUDGET_EVENT_EXCHANGE:budget.events.exchange}
      routing-key: ${BUDGET_EVENT_ROUTING:budget.events.routing}
      queue: ${BUDGET_EVENT_QUEUE:budget.events.queue}
