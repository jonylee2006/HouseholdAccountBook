spring:
  application:
    name: lazyledger-backend
  datasource:
    url: jdbc:mysql://localhost:3306/lazyledger?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000

server:
  port: 8080
  servlet:
    context-path: /api

lazyledger:
  storage:
    bucket: ${STORAGE_BUCKET:mock-bucket}
    callback-url: ${STORAGE_CALLBACK:https://example.com/callback}
