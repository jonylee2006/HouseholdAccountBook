spring:
  application:
    name: lazyledger-backend
  datasource:
    url: jdbc:mysql://localhost:3306/lazyledger?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

server:
  port: 8080
  servlet:
    context-path: /api

lazyledger:
  storage:
    type: ${STORAGE_TYPE:local}
    local-base-path: ${STORAGE_LOCAL_PATH:${user.home}/lazyledger/storage}
  import:
    queue:
      name: ${IMPORT_QUEUE_NAME:import.jobs.queue}
      exchange: ${IMPORT_EXCHANGE_NAME:import.jobs.exchange}
      routing-key: ${IMPORT_ROUTING_KEY:import.jobs.routing}
